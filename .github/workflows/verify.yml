name: Verify Civic Desk
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ''
      NEXT_TELEMETRY_DISABLED: '1'
      MONGOMS_VERSION: 7.0.24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run test:next
      - run: npm run eval
      - uses: actions/upload-artifact@v4
        with:
          name: offline-evaluation
          path: evaluation/results/offline.json
